<style>
:root{--space:#02040a;--gold:#f2c14e;--ink:#e9eefb;--muted:#9aa8c9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 82% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 28% 78%,#cfe0ff 50%,transparent 51%),radial-gradient(1px 1px at 91% 66%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 55% 6%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 6% 52%,#cfe0ff 50%,transparent 51%),radial-gradient(1px 1px at 70% 92%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 44% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 18% 90%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 96% 36%,#fff 50%,transparent 51%),radial-gradient(ellipse at 50% 45%,#0a1330 0%,#02040a 70%);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{outline:none}
header{position:fixed;top:0;left:0;right:0;z-index:2;text-align:center;padding:22px 16px 40px;pointer-events:none;background:linear-gradient(#02040acc,transparent)}
h1{font-size:clamp(1.7rem,4.5vw,2.8rem);font-weight:700;letter-spacing:-.02em;text-shadow:0 2px 18px #000}
header p{color:var(--muted);margin-top:4px;font-size:.95rem}
nav{position:fixed;left:0;right:0;bottom:0;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:40px 16px 22px;background:linear-gradient(transparent,#02040acc)}
nav a{color:var(--ink);text-decoration:none;border:1px solid rgba(242,193,78,.5);border-radius:999px;padding:8px 18px;font-size:.95rem;background:rgba(8,16,40,.72);backdrop-filter:blur(6px);transition:background .15s,border-color .15s}
nav a:hover,nav a:focus-visible{background:rgba(242,193,78,.2);border-color:var(--gold);outline:none}
#load{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:var(--space);color:var(--muted);transition:opacity .8s;font-size:1rem}
#load.off{opacity:0;pointer-events:none}
.tip{font-family:"Bricolage Grotesque",system-ui,sans-serif;background:rgba(5,10,28,.94);border:1px solid #f2c14e;border-radius:8px;padding:8px 12px;color:#e9eefb;max-width:240px}
.tip b{display:block;color:#f2c14e;font-size:1rem}
.tip span{color:#9aa8c9;font-size:.82rem}
</style>

114,169],[245,49],[198,-75],[75,-293],[65,193],[222,-140],[217,-33],[137,149]],[[59700,68010],[-78,-238],[-60,-446],[-75,-308],[-65,-103],[-93,191],[-125,263],[-198,847],[-29,-53],[115,-624],[171,-594],[210,-920],[102,-321],[90,-334],[249,-654],[-55,-103],[9,-384],[323,-530],[49,-121]],[[53191,70158],[326,-204],[117,51],[232,-98],[368,-264],[130,-526],[250,-114],[391,-248],[296,-293],[136,153],[133,272],[-65,452],[87,288],[200,277],[192,80],[375,-121],[95,-264],[104,-2],[88,-101],[276,-70],[68,-195]],[[59804,53833],[-164,643],[-127,137],[-48,236],[-141,288],[-171,42],[95,337],[147,14],[42,181]],[[61764,57990],[-98,-261],[-94,-277],[22,-163],[4,-180],[155,-10],[67,42],[62,-106]],[[61882,57035],[-61,-209],[103,-325],[102,-285],[106,-210],[909,-702],[233,4]],[[61966,58083],[66,-183],[-9,-245],[-158,-142],[119,-161]],[[61984,57352],[-102,-317]],[[61984,57352],[91,-109],[54,-245],[125,-247],[138,-2],[262,151],[302,70],[245,184],[138,39],[99,108],[158,20]],[[58449,49909],[-166,-182],[-67,60]],[[58564,52653],[115,161],[176,-132],[224,138],[195,-1],[171,272]],[[55279,77084],[100,2],[-69,-260],[134,-227],[-41,-278],[-65,-27]],[[55338,76294],[-52,-53],[-90,-138],[-41,-325]],[[55719,75309],[35,-5],[13,121],[164,91],[62,23]],[[55993,75539],[95,35],[128,9]],[[55993,75539],[-9,44],[33,71],[31,144],[-39,-4],[-54,110],[-46,28],[-36,94],[-52,36],[-40,84],[-50,-33],[-38,-196],[-66,-43]],[[55627,75874],[22,51],[-106,123],[-91,63],[-40,82],[-74,101]],[[55380,75322],[-58,46],[-78,192],[-120,118]],[[55627,75874],[-52,-132]],[[32866,56937],[160,77],[58,-21],[-11,-440],[-232,-65],[-50,53],[81,163],[-6,233]]],"bbox":[-180,-85.60903777459771,180,83.64513000000001],"transform":{"scale":[0.0036000360003600037,0.0016925586033320105],"translate":[-180,-85.60903777459771]}};

const loadEl = document.getElementById("load");
const glOk = (() => { try { return !!document.createElement("canvas").getContext("webgl"); } catch (e) { return false; } })();
if (typeof Globe === "undefined" || !glOk) {
  loadEl.textContent = !glOk ? "Tu navegador no tiene WebGL activado, por eso no se puede mostrar el globo." : "No se pudo cargar globe.gl. Revisa tu conexión a internet.";
  throw new Error("globe no disponible");
}
const byId = Object.fromEntries(SECTIONS.map(s => [s.id.padStart(3, "0"), s]));
const nav = document.getElementById("nav");
nav.innerHTML = SECTIONS.map(s => `<a href="${s.url}" data-id="${s.id.padStart(3, "0")}">${s.name}</a>`).join("");

const stage = document.getElementById("stage");
let hover = null, focusing = false;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

const globe = Globe({ animateIn: true })(stage)
  .globeImageUrl(TEX)
  .bumpImageUrl(BUMP)
  .backgroundColor("rgba(0,0,0,0)")
  .atmosphereColor("#7fb2ff").atmosphereAltitude(0.24)
  .polygonsTransitionDuration(300)
  .polygonCapColor(d => d === hover ? "rgba(255,214,102,.55)" : "rgba(242,193,78,.28)")
  .polygonSideColor(() => "rgba(242,193,78,.35)")
  .polygonStrokeColor(() => "#ffe08a")
  .polygonAltitude(d => d === hover ? 0.045 : 0.012)
  .polygonLabel(d => { const s = byId[d.sid]; return `<div class="tip"><b>${s.name}</b><span>${s.desc}</span></div>`; })
  .onPolygonHover(d => {
    hover = d;
    stage.style.cursor = d ? "pointer" : "grab";
    controls.autoRotate = !d && !focusing && !reduce;
    globe.polygonAltitude(globe.polygonAltitude()).polygonCapColor(globe.polygonCapColor()); // refresca el resalte
  })
  .onPolygonClick(d => { location.href = byId[d.sid].url; })
  .pointOfView({ lat: -15, lng: -65, altitude: 2.6 })
  .onGlobeReady(() => loadEl.classList.add("off"));

const controls = globe.controls();
controls.autoRotate = !reduce;
controls.autoRotateSpeed = 0.55;
controls.enablePan = false;
controls.minDistance = 150;
controls.maxDistance = 520;
controls.enableDamping = true;
controls.dampingFactor = 0.08;

function resize(){ globe.width(innerWidth).height(innerHeight); }
addEventListener("resize", resize); resize();
setTimeout(() => document.getElementById("load").classList.add("off"), 6000); // por si las texturas tardan

function mainCentroid(f){
  const g = f.geometry;
  if (g.type === "Polygon") return d3.geoCentroid(f);
  let best = null, area = -1;
  g.coordinates.forEach(c => { const p = { type: "Polygon", coordinates: c }, a = d3.geoArea(p); if (a > area) { area = a; best = p; } });
  return d3.geoCentroid(best);
}

const centers = {};
Promise.resolve(WORLD)
  .then(w => {
    const linked = topojson.feature(w, w.objects.countries).features
      .map(f => (f.sid = String(f.id).padStart(3, "0"), f))
      .filter(f => byId[f.sid]);
    linked.forEach(f => { const [lng, lat] = mainCentroid(f); centers[f.sid] = { lat, lng }; });
    globe.polygonsData(linked);
  });

// Al apretar un botón, el globo viaja a ese país; luego tocas el país para entrar
let resumeTimer;
nav.querySelectorAll("a").forEach(a => {
  a.addEventListener("click", e => {
    e.preventDefault();
    const c = centers[a.dataset.id]; if (!c) return;
    focusing = true; controls.autoRotate = false;
    globe.pointOfView({ lat: c.lat, lng: c.lng, altitude: 2.3 }, 1200);
    clearTimeout(resumeTimer);
    resumeTimer = setTimeout(() => { focusing = false; controls.autoRotate = !hover && !reduce; }, 10000);
  });
});
</script>
