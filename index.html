<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi mundo · Repositorio personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap" rel="stylesheet">
<style>
:root{--space:#03060f;--ocean:#1c3a8f;--land:#2f6b4a;--gold:#f2c14e;--ink:#e9eefb;--muted:#8d9bbd}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% 35%,#0c1738 0%,var(--space) 68%);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.7;
background-image:radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 82% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 28% 78%,#cfe0ff 50%,transparent 51%),radial-gradient(1px 1px at 91% 66%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 55% 6%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 6% 52%,#cfe0ff 50%,transparent 51%),radial-gradient(1px 1px at 70% 92%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 44% 40%,#fff 50%,transparent 51%)}
header{text-align:center;position:relative;z-index:1}
h1{font-size:clamp(1.8rem,5vw,3rem);font-weight:700;letter-spacing:-.02em}
header p{color:var(--muted);margin-top:6px;font-size:1rem}
main{position:relative;z-index:1;width:min(92vw,66vh,640px);aspect-ratio:1;margin:18px 0 8px}
main::before{content:"";position:absolute;inset:-4%;border-radius:50%;background:radial-gradient(circle,rgba(90,140,255,.38) 52%,rgba(90,140,255,.12) 62%,transparent 70%)}
svg{position:relative;width:100%;height:100%;cursor:grab;touch-action:pan-y;overflow:visible}
svg:active{cursor:grabbing}
.land{fill:var(--land);stroke:#1d4430;stroke-width:.4}
.link{fill:var(--gold);stroke:#fff3c9;stroke-width:.8;cursor:pointer;filter:url(#glow);transition:fill .15s}
.link:hover,.link.on{fill:#ffe08a}
.grat{fill:none;stroke:rgba(255,255,255,.07);stroke-width:.5}
#tip{position:fixed;z-index:5;pointer-events:none;background:rgba(5,10,28,.92);border:1px solid var(--gold);border-radius:8px;padding:8px 12px;font-size:.9rem;opacity:0;transition:opacity .12s;max-width:240px}
#tip b{display:block;color:var(--gold)}
#tip span{color:var(--muted);font-size:.8rem}
nav{position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:760px}
nav a{color:var(--ink);text-decoration:none;border:1px solid rgba(242,193,78,.45);border-radius:999px;padding:8px 16px;font-size:.95rem;background:rgba(10,20,50,.6);transition:background .15s,border-color .15s}
nav a:hover,nav a:focus-visible{background:rgba(242,193,78,.18);border-color:var(--gold);outline:none}
footer{position:relative;z-index:1;color:var(--muted);font-size:.8rem;margin-top:22px}
</style>
</head>
<body>
<header>
  <h1>Mi mundo</h1>
  <p>Arrastra el globo y toca un país dorado para entrar.</p>
</header>
<main><svg id="globe" viewBox="0 0 640 640" role="img" aria-label="Globo terráqueo interactivo con enlaces a mis secciones"></svg></main>
<nav id="nav" aria-label="Secciones"></nav>
<div id="tip"></div>
<footer>Pasa el cursor sobre el globo para pausar la rotación.</footer>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
/* ============ CONFIGURACIÓN: edita aquí tus secciones ============
   id   = código numérico ISO del país (ver tabla en el README)
   url  = enlace a tu página (ruta relativa si está en este repo,
          o URL completa si es otro repositorio, ej. https://TU-USUARIO.github.io/medicina/)  */
const SECTIONS = [
  { id: "152", name: "Medicina",      desc: "Apuntes por sistemas, resúmenes, audios", url: "https://TU-USUARIO.github.io/medicina/" },
  { id: "392", name: "Hábitos",       desc: "Registro diario y seguimiento",           url: "https://TU-USUARIO.github.io/habitos/" },
  { id: "818", name: "Construcciones",desc: "Proyectos, planos y referencias",         url: "https://TU-USUARIO.github.io/construcciones/" },
  { id: "840", name: "Economía",      desc: "Finanzas, mercados y análisis",           url: "https://TU-USUARIO.github.io/economia/" },
  { id: "076", name: "Vegetación",    desc: "Plantas, cultivos y ecosistemas",         url: "https://TU-USUARIO.github.io/vegetacion/" }
];
/* ================================================================ */

const byId = Object.fromEntries(SECTIONS.map(s => [s.id, s]));
const nav = document.getElementById("nav");
nav.innerHTML = SECTIONS.map(s => `<a href="${s.url}" data-id="${s.id}">${s.name}</a>`).join("");

const W = 640, R = 300;
const svg = d3.select("#globe");
const proj = d3.geoOrthographic().scale(R).translate([W/2, W/2]).clipAngle(90).rotate([70, -15]);
const path = d3.geoPath(proj);

const defs = svg.append("defs");
defs.append("radialGradient").attr("id","oc").attr("cx",".35").attr("cy",".3").attr("r",".9")
  .html('<stop offset="0" stop-color="#4a78e0"/><stop offset=".55" stop-color="#1c3a8f"/><stop offset="1" stop-color="#091449"/>');
defs.append("radialGradient").attr("id","sh").attr("cx",".38").attr("cy",".32").attr("r",".75")
  .html('<stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/>');
defs.append("filter").attr("id","glow").attr("x","-30%").attr("y","-30%").attr("width","160%").attr("height","160%")
  .html('<feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>');

const sphere = {type:"Sphere"};
svg.append("path").attr("class","sea").datum(sphere).attr("fill","url(#oc)");
const gratG = svg.append("path").attr("class","grat").datum(d3.geoGraticule10());
const gCountries = svg.append("g");
svg.append("path").attr("class","shade").datum(sphere).attr("fill","url(#sh)").style("pointer-events","none");

let rot = proj.rotate(), paused = false, focusing = false, feats = [];
const tip = document.getElementById("tip");

function draw(){
  proj.rotate(rot);
  svg.select(".sea").attr("d", path);
  gratG.attr("d", path);
  svg.select(".shade").attr("d", path);
  gCountries.selectAll("path").attr("d", path);
}

fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json")
  .then(r => r.json())
  .then(w => {
    feats = topojson.feature(w, w.objects.countries).features;
    feats.forEach(f => f.sid = String(f.id).padStart(3, "0"));
    // primero los países sin enlace, luego los enlazados (quedan encima)
    const sorted = [...feats.filter(f => !byId[f.sid]), ...feats.filter(f => byId[f.sid])];
    gCountries.selectAll("path").data(sorted).join("path")
      .attr("class", d => byId[d.sid] ? "link" : "land")
      .attr("tabindex", d => byId[d.sid] ? 0 : null)
      .attr("role", d => byId[d.sid] ? "link" : null)
      .attr("aria-label", d => byId[d.sid]?.name)
      .on("mousemove", (e,d) => showTip(e,d))
      .on("mouseleave", () => tip.style.opacity = 0)
      .on("click", (e,d) => { const s = byId[d.sid]; if (s) location.href = s.url; })
      .on("keydown", (e,d) => { if (e.key === "Enter") { const s = byId[d.sid]; if (s) location.href = s.url; } });
    draw();
    d3.timer(tick);
  });

function showTip(e, d){
  const s = byId[d.sid];
  if (!s) { tip.style.opacity = 0; return; }
  tip.innerHTML = `<b>${s.name}</b><span>${s.desc}</span>`;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 250) + "px";
  tip.style.top = (e.clientY + 14) + "px";
  tip.style.opacity = 1;
}

let last = 0;
function tick(t){
  const dt = t - last; last = t;
  if (!paused && !focusing && !dragging) { rot[0] += dt * 0.008; }
  draw();
}

// Pausar al pasar el cursor
const main = document.querySelector("main");
main.addEventListener("mouseenter", () => paused = true);
main.addEventListener("mouseleave", () => paused = false);

// Arrastrar para girar
let dragging = false;
svg.call(d3.drag()
  .on("start", () => dragging = true)
  .on("drag", e => { rot[0] += e.dx * 0.4; rot[1] = Math.max(-60, Math.min(60, rot[1] - e.dy * 0.4)); })
  .on("end", () => dragging = false));

// Botones: al pasar sobre uno, el globo gira hacia ese país
nav.querySelectorAll("a").forEach(a => {
  const go = () => {
    const f = feats.find(f => f.sid === a.dataset.id); if (!f) return;
    const c = d3.geoCentroid(f), target = [-c[0], -c[1]];
    const i = d3.interpolate(rot, target);
    focusing = true;
    d3.transition().duration(1000).tween("rotate", () => t => { rot = i(t); })
      .on("end", () => focusing = false);
    gCountries.selectAll("path").classed("on", d => d.sid === a.dataset.id);
  };
  a.addEventListener("mouseenter", go);
  a.addEventListener("focus", go);
  a.addEventListener("mouseleave", () => { focusing = false; gCountries.selectAll("path").classed("on", false); });
});

if (matchMedia("(prefers-reduced-motion: reduce)").matches) paused = true;
</script>
</body>
</html>
